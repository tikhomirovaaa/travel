
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: traveldb
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: travelpass
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    ports:
      - "8000:8000"  
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: bash -c "python manage.py migrate && python manage.py collectstatic --no-input && gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ../backend:/app
    environment:
      DATABASE_URL: postgres://traveluser:travelpass@db:5432/traveldb
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=/api/

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data: